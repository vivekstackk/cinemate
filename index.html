<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CineMate</title>

    <meta
      name="description"
      content="Discover movies by mood, explore trending films, follow cinema awards, and build your personal movie collections with CineMate."
    />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#111111" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CineMate" />
    <meta
      property="og:title"
      content="CineMate"
    />
    <meta
      property="og:description"
      content="Find your next favourite film, explore cinema, and build your personal movie journal."
    />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter / X preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="CineMate"
    />
    <meta
      name="twitter:description"
      content="Explore films, find your next favourite, and create your personal movie collections."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>CineMate — Beyond the Frame | Discover Movies</title>
    <meta
      name="description"
      content="CineMate helps you discover unforgettable films, explore cinema, find movies by mood, and curate your personal film collections."
    />
    <meta
      name="keywords"
      content="CineMate, movie discovery, film recommendations, movies by mood, movie collections, cinema, film journal"
    />
    <meta name="author" content="CineMate" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f7f6f4" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="shortcut icon" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=3" />

    <!-- Canonical URL: replace with your deployed URL -->
    <!-- <link rel="canonical" href="https://your-domain.com/" /> -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CineMate" />
    <meta property="og:title" content="CineMate — Beyond the Frame" />
    <meta
      property="og:description"
      content="Discover cinema, explore stories, and find your next unforgettable film."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CineMate — Beyond the Frame" />
    <meta
      name="twitter:description"
      content="Discover cinema, explore stories, and find your next unforgettable film."
    />
    <meta name="twitter:image" content="/og-image.png" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
